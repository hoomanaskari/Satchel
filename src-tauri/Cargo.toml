[package]
name = "satchel"
version = "0.1.4"
description = "Satchel clipboard manager"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "satchel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: menu bar icon. `macos-private-api`: transparent web view
# background (needed for the glass shelf); Satchel is not an App Store app.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
satchel-core = { path = "../crates/satchel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Official Tauri plugin; registers the shelf hotkey through the OS hotkey API
# (Carbon `RegisterEventHotKey` on macOS: event driven, no Accessibility
# permission, no polling). No front-end permission is granted for it.
tauri-plugin-global-shortcut = "2"
# Already in the dependency tree (tray-icon/muda). Streaming decode lets the
# thumbnailer downscale huge images row by row without a full RGBA buffer.
png = "0.18"
# Link previews (`link_preview/http.rs`), the only network code, used only
# when "Show link previews" is on. Small blocking HTTP/1.1 client: rustls
# with the bundled Mozilla roots (no OpenSSL, no system keychain), gzip.
# No cookie store, no JSON, no proxy support compiled in beyond what is
# switched off at run time. Its resolver hook lets every resolved address be
# checked before connecting. Not the Tauri HTTP plugin: nothing is exposed
# to the web view.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# Updates of the installed Satchel (`updates.rs`), used from Rust only: no
# window gets its permissions. Official Tauri plugin: checks GitHub's
# latest.json, verifies the archive's minisign signature (and signed
# version), swaps the app bundle in place. Brings reqwest/hyper with rustls
# (ring), tar/flate2 and zip. Not registered in Satchel Dev.
tauri-plugin-updater = "2"

# macOS: these crates are already pulled in by tao/wry; listing them here only
# enables the AppKit classes Satchel calls directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Already in the tree (objc2-app-kit / tao). The menu bar animation's
# NSTimer takes a block.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "block2",
  "NSBundle",
  # NSTimer interval (NSTimeInterval).
  "NSDate",
  "NSData",
  "NSDictionary",
  # One Satchel at a time: a later copy asks the running one to show its
  # shelf (`instance.rs`), and Satchel notes which app was active before it.
  "NSDistributedNotificationCenter",
  # Open at login (`platform/macos_login.rs`): SMAppService's errors.
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSFileManager",
  "NSString",
  "NSURL",
  "NSValue",
  "NSObject",
  "NSObjCRuntime",
  "NSGeometry",
  # The menu bar animation's frame timer.
  "NSRunLoop",
  "NSTimer",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  # CGFloat setters such as NSGlassEffectView.cornerRadius.
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  # Colors copied from color wells and pickers (NSColor on the pasteboard).
  "NSColor",
  "NSColorSpace",
  "NSControl",
  # The mouse location, to open the settings window on the display in use.
  "NSEvent",
  "NSGlassEffectView",
  "NSGraphics",
  # App icons for the excluded-apps picker, and its "Choose…" open panel.
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSOpenPanel",
  "NSSavePanel",
  "NSPanel",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  # The menu bar icon, animated when a clip is saved.
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFBase",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
] }
