# cargo-about configuration for `pnpm notices` (scripts/notices.ts), which writes
# THIRD-PARTY-NOTICES.txt. See docs/BUILDING.md, "Third-party notices".
#
# `accepted` is the allow-list for every package in the shipped app, Rust and npm alike: a
# package whose licence cannot be satisfied from it stops generation. Add a licence here only
# after checking what it asks of a binary distribution. The order is the preference when a
# package offers a choice ("MIT OR Apache-2.0" is listed under MIT).
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  # File-level copyleft: fine for crates used unmodified; the notices point at their source.
  "MPL-2.0",
  # webpki-roots (Mozilla's CA certificate list).
  "CDLA-Permissive-2.0",
]

# The Mac app. scripts/notices.ts narrows cargo-about's list further to the crates compiled into
# the app binary for these targets (`cargo tree -e normal,no-proc-macro`), so build scripts,
# proc-macros and their dependencies are left out.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
